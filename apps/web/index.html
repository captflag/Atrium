<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Baseline CSP (SECURITY.md §4, M0). Deliberately permissive enough for the
      Vite dev server: HMR needs a websocket on connect-src, and injected styles
      need style-src 'unsafe-inline'.

      Production must serve a stricter policy as a real Content-Security-Policy
      *header* (a meta tag cannot carry frame-ancestors or a report endpoint).
      When the preview pane lands in M6, frame-src gets the preview origin only.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        font-src 'self';
        connect-src 'self' ws: wss:;
        frame-src 'none';
        object-src 'none';
        base-uri 'none';
        form-action 'none'
      "
    />
    <title>Atrium</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
